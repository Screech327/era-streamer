<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ERA — Matchup Graphic Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="matchup-graphic.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  /* Fill whatever viewport we're in (1920x1080 OBS source, or a small
     control-panel preview iframe) and center the fixed 1920x1080 design
     stage, scaled to fit — so the same file works at broadcast size AND in
     a tiny preview without cropping. */
  html,body{width:100vw;height:100vh;background:transparent;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#e0e0e0;}
  body{display:flex;align-items:center;justify-content:center;}
  #stage{width:1920px;height:1080px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transform-origin:center center;}
  /* Full-bleed: the card fills the entire 1920x1080 frame so 'Fit to screen'
     in OBS covers the whole screen edge-to-edge (no transparent margins, no
     manual stretching). The website admin tool keeps the floating-card look. */
  #stage .mg-card{width:1920px;height:1080px;border-radius:0;box-shadow:none;display:flex;flex-direction:column;padding:60px 88px;}
  #stage .mg-body{flex:1 1 auto;align-items:center;}
  /* Scale the content up so it reads well filling the whole frame. */
  #stage .mg-banner-league{font-size:62px;letter-spacing:14px;}
  #stage .mg-team-name{font-size:60px;}
  #stage .mg-logo-wrap{width:152px;height:152px;}
  #stage .mg-players{gap:22px;}
  #stage .mg-player{padding:20px 26px;}
  #stage .mg-pn{font-size:40px;}
  #stage .mg-mmr{font-size:17px;}
  #stage .mg-stat{min-width:120px;padding:12px 16px;}
  #stage .mg-stat-v{font-size:36px;}
  #stage .mg-stat-l{font-size:14px;}
  #stage .mg-chip{min-width:62px;}
  #stage .mg-chip-v{font-size:24px;}
  #stage .mg-vs-text{font-size:76px;}
  #msg{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:6px;color:#888;text-align:center;}
</style>
</head>
<body>
  <div id="stage"><div id="msg">Loading…</div></div>

  <script src="matchup-graphic-core.js"></script>
  <script>
  (function(){
    var C = window.MatchupCore;
    var stage = document.getElementById('stage');
    // teams.js TEAM_DATA slot order — stream_match.left.slot indexes this.
    var ORG_SLOTS = ['berk','qc','bamboo','suit','leeds','mont','vb','osaka'];

    var cloud = null;     // {players, archive, aliases, scheduled}
    var agg = null;
    var minGames = 11;

    function showMsg(text){ stage.innerHTML=''; var d=document.createElement('div'); d.id='msg'; d.textContent=text; stage.appendChild(d); }

    // Local server settings (this overlay's own host), Supabase-shaped.
    function localGet(key){
      return fetch('/rest/v1/settings?key=eq.'+key+'&select=value')
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(rows){ return rows && rows[0] ? rows[0].value : null; })
        .catch(function(){ return null; });
    }

    function applySubs(matchup, subs){
      if (!subs) return matchup;
      ['home','away'].forEach(function(side){
        var map = subs[side] || {};
        var roster = matchup[side].roster || [];
        var defaultNames = roster.map(function(p){ return p.name; });
        Object.keys(map).forEach(function(idxStr){
          var idx = parseInt(idxStr,10);
          var name = map[idxStr];
          if (!name) return;
          var pl = (cloud.players||[]).find(function(p){ return p.name===name; });
          var mmr = pl ? (pl.mmr||0) : 0;
          var isSub = defaultNames.indexOf(name) === -1;
          while (roster.length <= idx) roster.push({ name:'', mmr:0 });
          roster[idx] = { name:name, mmr:mmr, isSub:isSub };
        });
        matchup[side].roster = roster;
      });
      return matchup;
    }

    function buildFromCurrent(match){
      if (!match || !match.left || !match.right) return null;
      var pubLeague = C.ADMIN_TO_PUBLIC[match.left.league];
      var homeOrg = ORG_SLOTS[match.left.slot];
      var awayOrg = ORG_SLOTS[match.right.slot];
      if (!pubLeague || !homeOrg || !awayOrg) return null;
      return C.buildMatchup(pubLeague, homeOrg, awayOrg, cloud.players);
    }

    function renderNow(cfg, match, series){
      cfg = cfg || {};
      var matchup;
      if (cfg.mode === 'slate'){
        var slate = C.resolveTonight(cloud.scheduled, cloud.players, new Date());
        if (!slate.length){ showMsg('No matchups scheduled tonight'); return; }
        matchup = slate[Math.min(cfg.slateIndex||0, slate.length-1)];
        // resolveTonight already attaches rosters; ensure org present
        if (!matchup.home.org || !matchup.away.org){ showMsg('Could not resolve tonight’s teams'); return; }
        matchup = { league: matchup.league, home: matchup.home, away: matchup.away };
      } else {
        matchup = buildFromCurrent(match);
        if (!matchup){ showMsg('Pick teams in the MATCH panel and PUSH TO OVERLAY'); return; }
      }
      applySubs(matchup, cfg.subs);
      var seriesVal = series || {};
      var card = C.renderCard(matchup, agg, {
        showStats: cfg.showStats !== false,
        showSeries: cfg.showSeries !== false,
        statMode: cfg.statMode || 'highlight',
        series: { format: seriesVal.format, leftWins: seriesVal.leftWins, rightWins: seriesVal.rightWins },
        players: cloud.players,
        minGames: minGames,
      });
      mountCard(card);
    }

    function mountCard(card){
      stage.innerHTML = '';
      stage.appendChild(card);
    }

    // Scale the fixed 1920x1080 design stage to fit the actual viewport
    // (1:1 in a 1920x1080 OBS source, shrunk in a small preview iframe).
    function fitStage(){
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitStage);

    function refresh(){
      return Promise.all([
        localGet('stream_matchup_graphic'),
        localGet('stream_match'),
        localGet('stream_series'),
      ]).then(function(r){ renderNow(r[0], r[1], r[2]); });
    }

    function init(){
      fitStage();
      C.fetchCloud().then(function(d){
        cloud = d;
        agg = C.aggregate(d.archive, d.aliases, d.players);
        minGames = C.minGamesFor(C.getCurrentEraWeek(new Date()));
        return refresh();
      }).catch(function(e){ showMsg('Data error: ' + (e && e.message || e)); });

      // Live updates from the control panel via the local server WebSocket.
      try {
        var ws = new WebSocket('ws://' + location.host);
        ws.onmessage = function(evt){
          var msg; try { msg = JSON.parse(evt.data); } catch(_) { return; }
          if (msg && msg.Event === 'SettingsChanged' && msg.Data &&
              (msg.Data.key === 'stream_matchup_graphic' || msg.Data.key === 'stream_match' || msg.Data.key === 'stream_series')){
            if (cloud) refresh();
          }
        };
      } catch(_) {}
    }

    init();
  })();
  </script>
</body>
</html>
