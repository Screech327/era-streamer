// ── Series rendering ────────────────────────────
function renderSeriesSide(side, format, wins) {
  const el = document.getElementById(side + 'Series');
  const total = format === 'BO7' ? 4 : 3;
  el.innerHTML = '';
  // Fill from the inside out: dots nearest the center timer light up first,
  // so each team's wins emanate outward toward their score block.
  // Right side: index 0 is the leftmost (= closest to timer) — fill 0..wins-1.
  // Left side: index 0 is the leftmost (= farthest from timer) — invert so
  // the rightmost `wins` dots are filled instead.
  for (let i = 0; i < total; i++) {
    const filled = side === 'left' ? (i >= total - wins) : (i < wins);
    const dot = document.createElement('div');
    dot.className = 'series-dot' + (filled ? ' won' : '');
    el.appendChild(dot);
  }
  el.classList.add('visible');
}

async function fetchSeries() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/settings?key=eq.stream_series&select=value,updated_at', { headers: REST_HEADERS });
    if (!r.ok) return null;
    const arr = await r.json();
    return arr[0] || null;
  } catch (e) { return null; }
}

let lastSeriesSig = '';
function applySeries(value) {
  const row = document.getElementById('seriesRow');
  if (!value || !value.format) {
    if (row) row.classList.remove('visible');
    const lEl = document.getElementById('leftWinner');
    const rEl = document.getElementById('rightWinner');
    if (lEl) lEl.classList.remove('visible');
    if (rEl) rEl.classList.remove('visible');
    return;
  }
  const lw = value.leftWins  || 0;
  const rw = value.rightWins || 0;
  renderSeriesSide('left',  value.format, lw);
  renderSeriesSide('right', value.format, rw);
  // Once one side hits the win threshold the series is over; freeze on
  // the final game number. Also hard-clamp at maxGames (5 for BO5, 7
  // for BO7) so producer over-bumping or stale data never shows the
  // impossible GAME 6 / GAME 8.
  const winsToWin = value.format === 'BO7' ? 4 : 3;
  const maxGames  = winsToWin * 2 - 1;
  const seriesOver = lw >= winsToWin || rw >= winsToWin;
  const rawGame = seriesOver ? (lw + rw) : (lw + rw + 1);
  const game = Math.max(1, Math.min(rawGame, maxGames));
  const boEl = document.getElementById('seriesBo');
  if (boEl) boEl.textContent = 'GAME ' + game + ' · ' + value.format;
  // Toggle WINNER label under each team's name when they hit the threshold.
  const lEl = document.getElementById('leftWinner');
  const rEl = document.getElementById('rightWinner');
  if (lEl) lEl.classList.toggle('visible', lw >= winsToWin);
  if (rEl) rEl.classList.toggle('visible', rw >= winsToWin);
  if (row) row.classList.add('visible');
}

// Notify the embedding control window (when running inside the streamer's
// preview iframe) that we just applied a state change — used to flash a
// "✓ PUSHED" badge on the preview so the producer knows the overlay
// actually picked up their push. Safe no-op when running standalone in
// OBS (window.parent === window).
function notifyParentApplied(target, updatedAt) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'overlay-applied', target, updated_at: updatedAt }, '*');
    }
  } catch (_) {}
}

async function poll() {
  const [matchRow, seriesRow] = await Promise.all([fetchMatch(), fetchSeries(), fetchOverlayConfig()]);
  if (matchRow && matchRow.value) {
    const sig = JSON.stringify(matchRow.value) + '|' + matchRow.updated_at;
    if (sig !== lastSig) {
      lastSig = sig;
      await applyMatch(matchRow.value);
      notifyParentApplied('match', matchRow.updated_at);
    }
  }
  if (seriesRow && seriesRow.value) {
    const sig = JSON.stringify(seriesRow.value) + '|' + seriesRow.updated_at;
    if (sig !== lastSeriesSig) {
      lastSeriesSig = sig;
      applySeries(seriesRow.value);
      notifyParentApplied('series', seriesRow.updated_at);
    }
  }
  setTimeout(poll, 2000);
}

// ── Local stats bridge (ws://127.0.0.1:49124) ────────────────────────────
// Powers the bottom-left "now watching" card. Bridge runs on the streamer's
// machine (see development/era-rl-admin/bridge/). If it isn't running the card
// stays hidden — the rest of the overlay continues to work as before.
let statsWs = null;
let statsBackoff = 1500;
// Tracks the server's appVersion seen on the most recent WS Hello. If
// the server reports a different version on a later reconnect, this
// overlay is running stale HTML and reloads itself.
let lastServerVersion = null;

function nwHide() {
  const el = document.getElementById('nowWatching');
  if (el) el.classList.remove('visible');
  hideBoostIndicator();
}

// ── Boost indicator (bottom-right 270° arc) ─────────────────────────
function applyBoostIndicator(boost, color) {
  // Ring = 2πr where r=45 ≈ 282.7. Visible arc covers 270° ≈ 212 at full
  // boost. Animate via the FIRST value of stroke-dasharray (visible
  // length) so the arc always starts at the same point and just grows
  // — dashoffset-based fill rotated the gap around the ring as the
  // value changed, which read as the meter spinning.
  const RING = 282.74;
  const ARC = 212;
  const el = document.getElementById('boostIndicator');
  if (!el) return;
  const pct = Math.max(0, Math.min(100, Number(boost) || 0));
  const fill = document.getElementById('boostFill');
  const valEl = document.getElementById('boostValue');
  if (color) el.style.setProperty('--team-color', color);
  if (fill) {
    const visible = ARC * pct / 100;
    fill.style.strokeDasharray = visible + ' ' + (RING - visible);
    // Hide the stroke at 0% so the rounded line cap doesn't render a
    // tiny dot at the start of the arc.
    fill.classList.toggle('has-fill', pct > 0);
  }
  if (valEl) valEl.textContent = Math.round(pct);
  el.classList.add('visible');
}
function hideBoostIndicator() {
  const el = document.getElementById('boostIndicator');
  if (el) el.classList.remove('visible');
}

// Names + boosts come straight from the live RL bridge. TeamNum 0 → left,
// TeamNum 1 → right. Whichever players RL reports on each side fill the
// pre-rendered slots in bridge order.
function updatePlayerBoosts(data) {
  // Accept either the full UpdateState object (preferred — gives us the
  // spectator target) or just the Players array (legacy callers that
  // only need to clear the rows).
  const bridgePlayers = Array.isArray(data) ? data : (data && data.Players);
  const target = (data && data.Game && data.Game.bHasTarget) ? data.Game.Target : null;
  const players = (bridgePlayers || []).filter(p => p && p.Name);
  fillSide('left',  players.filter(p => p.TeamNum === 0), target);
  fillSide('right', players.filter(p => p.TeamNum === 1), target);
}

// Per-variant secondary boost visual. Banners G/H need extra DOM updates
// beyond the shared .player-boost-fill width. fillSide calls this after
// each row's boost value lands.
function applyBoostVisual(row, pct) {
  // G — Hex Cells: light up segments as boost crosses each k/6 threshold.
  const hexes = row.querySelectorAll('.bg-hex');
  if (hexes.length) {
    const lit = Math.min(hexes.length, Math.round(pct * hexes.length / 100));
    hexes.forEach((h, i) => h.classList.toggle('lit', i < lit));
  }
  // H — Radial: 270° arc gauge. Visible arc length is 212 (0..212).
  const arc = row.querySelector('.bh-fill');
  if (arc) {
    const visible = 212 * pct / 100;
    arc.style.strokeDasharray = visible + ' 283';
  }
  const bhNum = row.querySelector('.bh-num');
  if (bhNum) bhNum.textContent = Math.round(pct);
  // I — Speedometer: rotate the SVG needle around (50,55) in user
  // coordinates. boost 0..100 → -90deg..+90deg.
  const needle = row.querySelector('.bi-needle');
  if (needle) {
    const angle = -90 + pct * 1.8;
    needle.setAttribute('transform', 'rotate(' + angle + ' 50 55)');
  }
  const biNum = row.querySelector('.bi-num');
  if (biNum) biNum.textContent = Math.round(pct);
  // J — LED Pips: light pips by k/10.
  const pips = row.querySelectorAll('.bj-pip');
  if (pips.length) {
    const lit = Math.min(pips.length, Math.round(pct * pips.length / 100));
    pips.forEach((p, i) => p.classList.toggle('lit', i < lit));
  }
  // K — Power Outline: expose --boost on the row so the name's
  // background-clip:text gradient stop updates.
  if (row.classList.contains('player-row')) {
    row.style.setProperty('--boost', pct + '%');
  }
}

function fillSide(side, sidePlayers, target) {
  const box = document.getElementById(side + 'Players');
  if (!box) return;
  const rows = box.querySelectorAll('.player-row');
  const sideTeamNum = side === 'left' ? 0 : 1;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const p = sidePlayers[i];
    const nameEl = row.querySelector('.player-name');
    const fillEl = row.querySelector('.player-boost-fill');
    const numEl  = row.querySelector('.player-boost-num');
    if (p) {
      row.classList.remove('empty');
      if (nameEl) nameEl.textContent = p.Name;
      const pct = Math.max(0, Math.min(100, Number(p.Boost) || 0));
      if (fillEl) fillEl.style.width = pct + '%';
      if (numEl) numEl.textContent = Math.round(pct);
      applyBoostVisual(row, pct);
      // Highlight the row if this is the spectated player. Match on
      // name + team so two-player same-name edge cases stay distinct.
      const isTarget = target && target.Name === p.Name && target.TeamNum === sideTeamNum;
      row.classList.toggle('is-target', !!isTarget);
    } else {
      row.classList.add('empty');
      if (nameEl) nameEl.textContent = '';
      if (fillEl) fillEl.style.width = '0%';
      if (numEl) numEl.textContent = '';
      applyBoostVisual(row, 0);
      row.classList.remove('is-target');
    }
  }
}

function sbHide() {
  const el = document.getElementById('scoreboard');
  if (el) el.classList.remove('visible');
}

function applyScoreColor(el, color) {
  if (!color) return;
  el.style.setProperty('--score-color', color);
  el.style.setProperty('--score-text', getContrastTextColor(color));
}

function renderScoreboard(data) {
  if (!data || !data.Game || !data.Game.Teams) {
    sbHide();
    return;
  }
  const teams = data.Game.Teams;
  const t0 = teams.find(t => t.TeamNum === 0);
  const t1 = teams.find(t => t.TeamNum === 1);

  const leftEl  = document.getElementById('sbLeftScore');
  const rightEl = document.getElementById('sbRightScore');
  // Always use the ERA team color extracted from the matchup logo. Fall back
  // to a neutral dark grey only if the matchup hasn't been pushed yet — we
  // explicitly avoid RL's lobby colors here so the scoreboard never shows
  // generic blue/orange when an ERA matchup is active.
  const leftColor  = matchupTeamColors[0] || '#2a2a2a';
  const rightColor = matchupTeamColors[1] || '#2a2a2a';
  if (t0) leftEl.textContent  = t0.Score != null ? t0.Score : 0;
  if (t1) rightEl.textContent = t1.Score != null ? t1.Score : 0;
  applyScoreColor(leftEl,  leftColor);
  applyScoreColor(rightEl, rightColor);

  const sec = data.Game.TimeSeconds != null ? data.Game.TimeSeconds : 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  document.getElementById('sbTimer').textContent = m + ':' + String(s).padStart(2, '0');

  const ot = document.getElementById('sbOt');
  if (data.Game.bOvertime) {
    ot.textContent = 'OVERTIME';
    ot.classList.add('active');
  } else {
    ot.textContent = '';
    ot.classList.remove('active');
  }

  document.getElementById('scoreboard').classList.add('visible');
}

function renderNowWatching(data) {
  if (!data || !data.Game || !data.Game.bHasTarget || !data.Game.Target) {
    nwHide();
    return;
  }
  const target = data.Game.Target;
  const player = (data.Players || []).find(p => p.Name === target.Name && p.TeamNum === target.TeamNum);
  if (!player) {
    nwHide();
    return;
  }
  // Prefer the matchup banner color (extracted from the team's ERA logo)
  // so the card matches brand instead of whatever RL's lobby palette
  // happened to be. Fall back to RL's ColorPrimary, then the generic
  // blue/orange for streams running without ERA assets.
  const teamData = (data.Game.Teams || []).find(t => t.TeamNum === target.TeamNum);
  const color = matchupTeamColors[target.TeamNum]
    || ((teamData && teamData.ColorPrimary) ? '#' + teamData.ColorPrimary : null)
    || (target.TeamNum === 0 ? '#6495ED' : '#ff8a3d');

  const el = document.getElementById('nowWatching');
  el.style.setProperty('--team-color', color);
  const snap = {
    name:    player.Name || '—',
    score:   player.Score   || 0,
    goals:   player.Goals   || 0,
    assists: player.Assists || 0,
    saves:   player.Saves   || 0,
    shots:   player.Shots   || 0,
    demos:   player.Demos   || 0,
    teamIdx: target.TeamNum,
  };
  lastNwSnapshot = snap;
  repaintNowWatching(snap);
  el.classList.add('visible');
  // Boost indicator follows the same spectated player + team color.
  applyBoostIndicator(player.Boost, color);
}

function connectStats() {
  try {
    statsWs = new WebSocket('ws://127.0.0.1:49124');
  } catch (e) {
    setTimeout(connectStats, statsBackoff);
    statsBackoff = Math.min(statsBackoff * 1.5, 10000);
    return;
  }
  statsWs.onopen = () => { statsBackoff = 1500; };
  statsWs.onerror = () => { /* silent — onclose handles retry */ };
  statsWs.onclose = () => {
    nwHide();
    sbHide();
    updatePlayerBoosts([]); // clear stale boost numbers
    setTimeout(connectStats, statsBackoff);
    statsBackoff = Math.min(statsBackoff * 1.5, 10000);
  };
  statsWs.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (!msg) return;
    if (msg.Event === 'UpdateState') {
      lastBridgeUpdate = msg.Data;
      renderNowWatching(msg.Data);
      renderScoreboard(msg.Data);
      updatePlayerBoosts(msg.Data);
      trackMatchSnapshot(msg.Data);
      trackGoalsViaUpdateState(msg.Data);
    } else if (msg.Event === 'MatchDestroyed') {
      nwHide();
      sbHide();
    } else if (msg.Event === 'MatchEnded') {
      nwHide();
      // Leave scoreboard up after match ends so the final score is visible.
      onMatchEnded(msg.Data);
    } else if (msg.Event === 'PodiumStart') {
      // Podium fires reliably even when MatchEnded is missed
      onMatchEnded(msg.Data);
    } else if (msg.Event === 'Goal') {
      // Bridge fires this on goal_scored. Show the popup with scorer +
      // assister + scoring team for the duration of the replay.
      handleGoalEvent(msg.Data);
    } else if (msg.Event === 'ReplayEnd' || msg.Event === 'ReplayWillEnd') {
      // Replay is wrapping — fade the popup before play resumes.
      hideGoalPopup();
    } else if (msg.Event === 'ServerHello') {
      // Sent on every WS connect. Compare against the server version we
      // saw on a prior connect — if it's different, this overlay is
      // running stale code (era-streamer was upgraded behind it) and
      // needs to reload. First-ever connect just stashes the version.
      const v = msg.Data && msg.Data.version;
      if (v) {
        if (lastServerVersion && lastServerVersion !== v) {
          // Cache-bust so OBS's CEF actually refetches the new HTML.
          const url = new URL(location.href);
          url.searchParams.set('v', v);
          location.replace(url.toString());
          return;
        }
        lastServerVersion = v;
      }
    } else if (msg.Event === 'SettingsChanged') {
      // Server broadcasts this when the producer upserts a settings row
      // (e.g. switches the player-card style). Re-fetch the relevant
      // config immediately so the overlay doesn't have to wait out the
      // 2s poll cycle — fixes "I changed the style mid-stream and OBS
      // didn't update for a while".
      const key = msg.Data && msg.Data.key;
      if (key === 'stream_overlay_config') {
        // Clear the style guards so apply* are guaranteed to re-render
        // even if the new value happens to match what was applied before
        // some other tick (race-condition safe).
        currentNwStyle = '';
        currentGoalStyle = '';
        currentBannerStyle = '';
        fetchOverlayConfig();
      } else if (key === 'stream_match')  { lastSig = ''; poll(); }
      else if (key === 'stream_series') { lastSeriesSig = ''; poll(); }
    }
  };
}
// Defer the initial bridge connect until we've checked the overlay config.
// Otherwise a no-bridge streamer would briefly see boost bars before the
// config comes back and hides them.
// `?nobridge=1` forces no-bridge mode locally for previewing the layout.
// The window flag also makes fetchOverlayConfig short-circuit so the 2s poll
// can't flap the body class back.
window.__overlayForceNoBridge = new URLSearchParams(location.search).get('nobridge') === '1';
if (window.__overlayForceNoBridge) applyOverlayConfig({ noBridge: true });
fetchOverlayConfig().then(() => {
  if (!noBridgeMode) {
    statsConnectStarted = true;
    connectStats();
  }
});

// Streamer-visible build version stamp — pulled from the local app's
// /api/update/state so it always matches the running app.
fetch('/api/update/state').then((r) => r.ok ? r.json() : null).then((s) => {
  const el = document.getElementById('overlayVersion');
  if (el && s && s.appVersion) el.textContent = 'v' + s.appVersion;
}).catch(() => {});

// ── Series recording (capture side) ────────────────────────────
// The control page sets recording.active=true. The overlay (running on the
// streamer's machine, with access to the bridge) snapshots each match's
// final stats on MatchEnded and pushes them into the same Supabase row.
let recordingState = null; // last loaded { active, format, games:[...] }
const liveMatch = {
  matchGuid: null,
  arena: '',
  teams: [],
  players: {}, // PrimaryId -> latest stats
};

function trackMatchSnapshot(data) {
  if (!data) return;
  if (data.MatchGuid && data.MatchGuid !== liveMatch.matchGuid) {
    // New match started without us seeing MatchEnded for the previous one —
    // capture the previous one before resetting (best-effort).
    if (liveMatch.matchGuid && Object.keys(liveMatch.players).length && recordingState && recordingState.active) {
      flushMatchToRecording(null);
    }
    liveMatch.matchGuid = data.MatchGuid;
    liveMatch.players = {};
  }
  if (data.Game) {
    if (data.Game.Teams && data.Game.Teams.length) liveMatch.teams = data.Game.Teams;
    if (data.Game.Arena) liveMatch.arena = data.Game.Arena;
  }
  for (const p of (data.Players || [])) {
    if (!p.PrimaryId) continue;
    liveMatch.players[p.PrimaryId] = {
      name: p.Name,
      teamNum: p.TeamNum,
      score: p.Score || 0,
      goals: p.Goals || 0,
      assists: p.Assists || 0,
      saves: p.Saves || 0,
      shots: p.Shots || 0,
      demos: p.Demos || 0,
      touches: p.Touches || 0,
    };
  }
}

// Track which matches we've already advanced the series for, since
// MatchEnded and PodiumStart can both fire and we want to advance once.
const advancedSeriesGuids = new Set();

function onMatchEnded(data) {
  // Series advancement + recording capture both happen server-side in
  // era-streamer (main.js -> server) so they work even when OBS isn't
  // open. The overlay's job here is to stay quiet — we used to also
  // bump stream_series and write stream_recording from here, but that
  // raced with the server-side path.
  return;
}

async function autoAdvanceSeries(winnerTeamNum) {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/settings?key=eq.stream_series&select=value', { headers: REST_HEADERS });
    const arr = r.ok ? await r.json() : [];
    const fresh = (arr[0] && arr[0].value) || { format: 'BO5', leftWins: 0, rightWins: 0 };
    const max = fresh.format === 'BO7' ? 4 : 3;
    if (winnerTeamNum === 0) fresh.leftWins  = Math.min(max, (fresh.leftWins  || 0) + 1);
    if (winnerTeamNum === 1) fresh.rightWins = Math.min(max, (fresh.rightWins || 0) + 1);
    await fetch(SUPABASE_URL + '/rest/v1/settings?on_conflict=key', {
      method: 'POST',
      headers: { ...REST_HEADERS, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' },
      body: JSON.stringify({
        key: 'stream_series',
        value: fresh,
        updated_at: new Date().toISOString(),
      }),
    });
  } catch (e) {
    console.error('[series] auto-advance failed', e);
  }
}

async function flushMatchToRecording(winnerTeamNum) {
  if (!recordingState || !recordingState.active) return;
  // Skip if already recorded
  const games = (recordingState.games || []);
  if (games.find(g => g.matchGuid === liveMatch.matchGuid)) return;
  if (!Object.keys(liveMatch.players).length) return;

  const teamScores = {};
  Object.values(liveMatch.players).forEach(p => {
    teamScores[p.teamNum] = (teamScores[p.teamNum] || 0) + (p.goals || 0);
  });

  // Capture team metadata so the post-game card can show real team
  // names and colors instead of generic blue/orange.
  const teamMeta = {};
  for (const t of (liveMatch.teams || [])) {
    if (t.TeamNum != null) {
      teamMeta[t.TeamNum] = {
        name: t.Name || ('Team ' + t.TeamNum),
        color: t.ColorPrimary || (t.TeamNum === 0 ? '1873FF' : 'C26418'),
        finalScore: t.Score != null ? t.Score : (teamScores[t.TeamNum] || 0),
      };
    }
  }

  const newGame = {
    matchGuid: liveMatch.matchGuid,
    endedAt: new Date().toISOString(),
    winnerTeamNum,
    arena: liveMatch.arena,
    teamScores,
    teams: teamMeta,
    players: { ...liveMatch.players },
  };

  // Re-fetch the recording row right before writing to minimize race with
  // the control page's reset button.
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/settings?key=eq.stream_recording&select=value', { headers: REST_HEADERS });
    const arr = r.ok ? await r.json() : [];
    const fresh = (arr[0] && arr[0].value) || { active:false, format:'BO5', games:[] };
    if (!fresh.active) return; // recording was stopped between snapshot and write
    if ((fresh.games || []).find(g => g.matchGuid === newGame.matchGuid)) return;
    fresh.games = (fresh.games || []).concat([newGame]);
    await fetch(SUPABASE_URL + '/rest/v1/settings?on_conflict=key', {
      method: 'POST',
      headers: { ...REST_HEADERS, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' },
      body: JSON.stringify({
        key: 'stream_recording',
        value: fresh,
        updated_at: new Date().toISOString(),
      }),
    });
    // Reset live match state so the next game starts clean
    liveMatch.matchGuid = null;
    liveMatch.players = {};
  } catch (e) {
    console.error('[recording] flush failed', e);
  }
}

async function fetchRecording() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/settings?key=eq.stream_recording&select=value', { headers: REST_HEADERS });
    if (!r.ok) return;
    const arr = await r.json();
    recordingState = (arr[0] && arr[0].value) || { active:false, format:'BO5', games:[] };
    renderPostGameCard(recordingState);
  } catch (e) {}
}

// Suppress the poll in test mode so manual demos don't get overridden by
// whatever's in Supabase. Production runs poll normally.
const __testModeActive = ['1','2','3','4','5','6'].includes(new URLSearchParams(location.search).get('test') || '');
if (!__testModeActive) {
  setInterval(fetchRecording, 2500);
  fetchRecording();
}

// ── Post-game / post-series card rendering ─────────────────────────────
// Producer toggles cardMode in stream_recording. 'game' shows the latest
// captured match; 'series' shows aggregated totals across all captured
// games of the active series.
function renderPostGameCard(rec) {
  const card = document.getElementById('postGame');
  if (!card) return;
  // Backward compat: older recordings used `cardVisible: true` to mean game.
  const mode = rec
    ? (rec.cardMode || (rec.cardVisible ? 'game' : null))
    : null;
  if (!mode || !(rec.games || []).length) {
    card.classList.remove('visible');
    return;
  }
  if (mode === 'series') renderPostSeries(rec);
  else                   renderPostGame(rec);
  card.classList.add('visible');
}

function pgTeamMetaFromRec(rec) {
  // Use the latest game's team metadata (names / fallback colors)
  const games = rec.games;
  const lastGame = games[games.length - 1];
  const meta = (lastGame && lastGame.teams) || {};
  const left  = meta[0] || { name:'BLUE',   color:'1873FF' };
  const right = meta[1] || { name:'ORANGE', color:'C26418' };
  // Prefer ERA-logo colors (matchup banners). Fall back to captured RL color.
  const leftColor  = matchupTeamColors[0] || ('#' + (left.color  || '1873FF'));
  const rightColor = matchupTeamColors[1] || ('#' + (right.color || 'C26418'));
  return {
    leftName:  (left.name  || 'BLUE').toUpperCase(),
    rightName: (right.name || 'ORANGE').toUpperCase(),
    leftColor, rightColor,
  };
}

function pgApplyHeaderColors(meta) {
  const card = document.getElementById('postGame');
  card.style.setProperty('--left-color',  meta.leftColor);
  card.style.setProperty('--right-color', meta.rightColor);
  document.getElementById('pgLeftScore').style.setProperty('--score-text',  getContrastTextColor(meta.leftColor));
  document.getElementById('pgRightScore').style.setProperty('--score-text', getContrastTextColor(meta.rightColor));
  document.getElementById('pgLeftName').textContent  = meta.leftName;
  document.getElementById('pgRightName').textContent = meta.rightName;
  document.getElementById('pgLeftRoster').className  = 'pg-roster pg-roster-left';
  document.getElementById('pgRightRoster').className = 'pg-roster pg-roster-right';
}

function pgRosterHtml(list) {
  const STAT_KEYS = [['SCORE','score'], ['GOALS','goals'], ['ASSISTS','assists'], ['SAVES','saves'], ['SHOTS','shots'], ['DEMOS','demos']];

  // Team total row — sum every stat across this team's players. Sits at the
  // top of the column as the headline number, players listed below.
  let html = '';
  if (list.length) {
    const totals = list.reduce((acc, [_, p]) => {
      STAT_KEYS.forEach(([_, k]) => { acc[k] = (acc[k] || 0) + (p[k] || 0); });
      return acc;
    }, {});
    html += '<div class="pg-player pg-team-total">';
    html += '<div class="pg-player-name">TEAM TOTAL</div>';
    html += '<div class="pg-player-stats">';
    STAT_KEYS.forEach(([l, k]) => {
      html += '<div class="pg-player-stat"><div class="l">' + l + '</div><div class="v">' + (totals[k] || 0) + '</div></div>';
    });
    html += '</div></div>';
  }

  html += list.map(([_, p]) => {
    let h = '<div class="pg-player">';
    h += '<div class="pg-player-name">' + escapeHtmlPg(p.name || '—') + '</div>';
    h += '<div class="pg-player-stats">';
    STAT_KEYS.forEach(([l, k]) => {
      const v = p[k];
      h += '<div class="pg-player-stat"><div class="l">' + l + '</div><div class="v">' + (v != null ? v : 0) + '</div></div>';
    });
    h += '</div></div>';
    return h;
  }).join('');

  return html;
}

function renderPostGame(rec) {
  const games = rec.games;
  const game  = games[games.length - 1];
  const meta  = pgTeamMetaFromRec(rec);
  pgApplyHeaderColors(meta);

  document.getElementById('pgEyebrow').textContent = 'POST-GAME STATS';
  const titleEl = document.getElementById('pgTitleEl');
  titleEl.innerHTML = 'GAME <span id="pgGameNum">' + games.length + '</span> RESULTS';

  const s0 = (game.teamScores && game.teamScores[0]) || 0;
  const s1 = (game.teamScores && game.teamScores[1]) || 0;
  document.getElementById('pgLeftScore').textContent  = s0;
  document.getElementById('pgRightScore').textContent = s1;

  const players = game.players || {};
  const leftPlayers  = Object.entries(players).filter(([_, p]) => p.teamNum === 0).sort((a,b) => (b[1].score||0) - (a[1].score||0));
  const rightPlayers = Object.entries(players).filter(([_, p]) => p.teamNum === 1).sort((a,b) => (b[1].score||0) - (a[1].score||0));
  document.getElementById('pgLeftRoster').innerHTML  = pgRosterHtml(leftPlayers);
  document.getElementById('pgRightRoster').innerHTML = pgRosterHtml(rightPlayers);
}

function renderPostSeries(rec) {
  const games = rec.games;
  const meta  = pgTeamMetaFromRec(rec);
  pgApplyHeaderColors(meta);

  document.getElementById('pgEyebrow').textContent = 'SERIES RESULTS · ' + (rec.format || 'BO5');
  const titleEl = document.getElementById('pgTitleEl');
  titleEl.innerHTML = 'SERIES <span>RESULTS</span>';

  // Series wins (count of games each team won)
  const wins = { 0: 0, 1: 0 };
  games.forEach(g => {
    if (g.winnerTeamNum != null) {
      wins[g.winnerTeamNum] = (wins[g.winnerTeamNum] || 0) + 1;
    } else {
      // No explicit winner — infer from team goals
      const s0 = (g.teamScores && g.teamScores[0]) || 0;
      const s1 = (g.teamScores && g.teamScores[1]) || 0;
      if (s0 > s1) wins[0]++; else if (s1 > s0) wins[1]++;
    }
  });
  document.getElementById('pgLeftScore').textContent  = wins[0];
  document.getElementById('pgRightScore').textContent = wins[1];

  // Sum per-player stats across every captured game, keyed by PrimaryId
  const totals = {};
  for (const g of games) {
    const pls = g.players || {};
    for (const pid in pls) {
      const p = pls[pid];
      if (!totals[pid]) totals[pid] = { name: p.name, teamNum: p.teamNum, score:0, goals:0, assists:0, saves:0, shots:0, demos:0 };
      const t = totals[pid];
      t.score   += p.score   || 0;
      t.goals   += p.goals   || 0;
      t.assists += p.assists || 0;
      t.saves   += p.saves   || 0;
      t.shots   += p.shots   || 0;
      t.demos   += p.demos   || 0;
      // Keep latest known name/team in case a player switched sides mid-series
      if (p.name) t.name = p.name;
      if (p.teamNum != null) t.teamNum = p.teamNum;
    }
  }
  const entries = Object.entries(totals);
  const leftPlayers  = entries.filter(([_, p]) => p.teamNum === 0).sort((a,b) => (b[1].score||0) - (a[1].score||0));
  const rightPlayers = entries.filter(([_, p]) => p.teamNum === 1).sort((a,b) => (b[1].score||0) - (a[1].score||0));
  document.getElementById('pgLeftRoster').innerHTML  = pgRosterHtml(leftPlayers);
  document.getElementById('pgRightRoster').innerHTML = pgRosterHtml(rightPlayers);
}

function escapeHtmlPg(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Auto-scale the 1920x1080 canvas to fit whatever the OBS Browser source
// (or browser window) size is. No per-resolution config needed.
function rescaleCanvas() {
  const c = document.querySelector('.canvas');
  if (!c) return;
  const sx = window.innerWidth / 1920;
  const sy = window.innerHeight / 1080;
  const s = Math.min(sx, sy);
  c.style.transform = 'scale(' + s + ')';
}
